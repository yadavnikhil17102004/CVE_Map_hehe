<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>CVE Map — Triage Dashboard</title>
  <meta name="description" content="CVE triage dashboard with real API-backed filtering and pagination."/>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" referrerpolicy="no-referrer"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" referrerpolicy="no-referrer"/>
  <link rel="stylesheet" href="style.css"/>
  <meta name="referrer" content="strict-origin-when-cross-origin"/>

  <style>
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #0d1117; }
    ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }

    .glass {
      background: rgba(22,27,34,0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(48,54,61,0.7);
    }

    .skeleton {
      background: linear-gradient(90deg, rgba(48,54,61,0.35) 25%, rgba(88,96,105,0.35) 37%, rgba(48,54,61,0.35) 63%);
      background-size: 400% 100%;
      animation: shimmer 1.3s ease infinite;
    }

    @keyframes shimmer {
      0% { background-position: 100% 0; }
      100% { background-position: 0 0; }
    }

    .sev-dot { width: 8px; height: 8px; border-radius: 9999px; display: inline-block; }
  </style>
</head>

<body class="dark bg-bg-dark text-gray-200 font-sans antialiased h-screen flex flex-col overflow-hidden">

<header class="h-14 border-b border-border flex items-center justify-between px-5 bg-surface shrink-0 z-20">
  <div class="flex items-center gap-2">
    <a href="index.html" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
      <span class="material-symbols-outlined text-primary text-2xl">radar</span>
      <h1 class="font-mono font-bold text-lg tracking-tight text-white">CVE <span class="text-primary">MAP</span></h1>
    </a>
    <span class="text-[10px] ml-1 px-2 py-0.5 rounded-full bg-surface-2 text-dim hidden sm:inline">Triage Dashboard</span>
  </div>

  <div class="flex items-center gap-2">
    <a href="index.html" class="hidden md:flex items-center gap-1.5 px-2.5 py-1.5 rounded border border-border text-xs font-medium hover:bg-surface-2 transition-colors text-white">
      <span class="material-symbols-outlined text-sm">home</span>Home
    </a>
    <a href="news.html" class="hidden md:flex items-center gap-1.5 px-2.5 py-1.5 rounded border border-border text-xs font-medium hover:bg-surface-2 transition-colors text-gray-300">
      <span class="material-symbols-outlined text-sm">public</span>News
    </a>
    <a href="docs.html" class="hidden md:flex items-center gap-1.5 px-2.5 py-1.5 rounded border border-border text-xs font-medium hover:bg-surface-2 transition-colors text-primary">
      <span class="material-symbols-outlined text-sm">book</span>Docs
    </a>
    <a href="/api/search" target="_blank" class="flex items-center gap-1.5 px-2.5 py-1.5 rounded border border-border text-xs font-medium hover:bg-surface-2 transition-colors text-gray-300">
      <span class="material-symbols-outlined text-sm">terminal</span>API JSON
    </a>
  </div>
</header>

<div class="flex flex-1 overflow-hidden">
  <aside class="w-72 bg-surface border-r border-border overflow-y-auto shrink-0 p-4 gap-4 z-10 hidden lg:flex flex-col">
    <div class="glass rounded-lg p-3 space-y-3">
      <h2 class="text-xs font-bold uppercase tracking-wider text-white">Workspace Filters</h2>

      <div>
        <label class="text-[10px] uppercase tracking-wider text-dim font-semibold">Search (optional)</label>
        <input id="search-input" type="text" placeholder="CVE, repo, owner, CWE..."
          class="mt-1 w-full bg-surface-2 border border-border rounded px-2 py-2 text-xs text-white placeholder-gray-500 outline-none focus:border-primary"/>
      </div>

      <div>
        <label class="text-[10px] uppercase tracking-wider text-dim font-semibold">Year</label>
        <select id="year-filter"
          class="mt-1 w-full bg-surface-2 border border-border rounded px-2 py-2 text-xs text-white outline-none focus:border-primary">
        </select>
      </div>

      <div>
        <label class="text-[10px] uppercase tracking-wider text-dim font-semibold block mb-1">Severity</label>
        <div class="space-y-1 text-xs">
          <label class="flex items-center gap-2"><input type="checkbox" name="severity" value="" class="severity-checkbox" checked>All</label>
          <label class="flex items-center gap-2"><input type="checkbox" name="severity" value="CRITICAL" class="severity-checkbox">Critical</label>
          <label class="flex items-center gap-2"><input type="checkbox" name="severity" value="HIGH" class="severity-checkbox">High</label>
          <label class="flex items-center gap-2"><input type="checkbox" name="severity" value="MEDIUM" class="severity-checkbox">Medium</label>
          <label class="flex items-center gap-2"><input type="checkbox" name="severity" value="LOW" class="severity-checkbox">Low</label>
        </div>
      </div>

      <div class="flex items-center justify-between">
        <span class="text-[10px] uppercase tracking-wider text-dim font-semibold">KEV only</span>
        <label class="inline-flex items-center cursor-pointer">
          <input id="kev-only" type="checkbox" class="sr-only peer">
          <div class="relative w-9 h-5 bg-surface-2 peer-focus:outline-none rounded-full peer border border-border peer-checked:bg-danger/40 peer-checked:border-danger/50">
            <div class="absolute top-[1px] left-[1px] bg-gray-300 w-4 h-4 rounded-full transition-transform peer-checked:translate-x-4"></div>
          </div>
        </label>
      </div>

      <div class="pt-1 flex gap-2">
        <button id="apply-filters" class="flex-1 px-3 py-2 rounded border border-primary text-primary text-[10px] font-semibold uppercase tracking-wider hover:bg-primary hover:text-white transition-colors">Apply Workspace Filters</button>
        <button id="clear-filters" class="px-3 py-2 rounded border border-border text-gray-300 text-[10px] font-semibold uppercase tracking-wider hover:bg-surface-2 hover:text-white transition-colors">Clear</button>
      </div>
    </div>
  </aside>

  <main class="flex-1 overflow-y-auto bg-bg-dark">
    <div class="p-4 md:p-5 space-y-4 max-w-7xl mx-auto">
      <div class="glass p-4 rounded-lg border-l-4 border-l-primary">
        <div class="text-[10px] uppercase tracking-wider text-dim font-bold">Total Matching CVEs</div>
        <div id="total-card" class="text-4xl font-mono font-bold text-white mt-1">—</div>
      </div>

      <div class="glass rounded-lg overflow-hidden flex flex-col" style="min-height:460px">
        <div class="px-4 py-3 border-b border-border bg-surface-2/30 flex items-center justify-between gap-3 flex-wrap">
          <div>
            <h2 class="text-sm font-bold text-white flex items-center gap-2">
              <span class="w-1.5 h-5 bg-primary rounded-sm"></span>
              Triage
            </h2>
            <p class="text-[10px] text-dim font-mono mt-1">Real API-backed CVE triage view.</p>
          </div>
          <div class="text-[10px] text-dim font-mono" id="result-meta">—</div>
        </div>

        <div class="grid grid-cols-12 gap-2 px-4 py-2 text-[10px] font-bold text-gray-500 uppercase tracking-wider border-b border-border/50 bg-surface-2/20">
          <div class="col-span-3">CVE ID</div>
          <div class="col-span-2">Severity</div>
          <div class="col-span-1">CVSS</div>
          <div class="col-span-1">KEV</div>
          <div class="col-span-1">EPSS</div>
          <div class="col-span-2 text-right">Repo Count</div>
          <div class="col-span-2 text-right">Activity</div>
        </div>

        <div id="cve-list" class="overflow-y-auto flex-1 divide-y divide-border/25"></div>

        <div class="px-4 py-3 border-t border-border bg-surface-2/20 flex items-center justify-between gap-3 flex-wrap">
          <div class="flex items-center gap-2 text-xs">
            <label class="text-dim">Rows</label>
            <select id="per-page" class="bg-surface-2 border border-border rounded px-2 py-1 text-xs text-white outline-none focus:border-primary">
              <option value="50">50</option>
              <option value="100">100</option>
              <option value="200">200</option>
            </select>
          </div>

          <div class="flex items-center gap-2">
            <button id="prev-page" class="px-3 py-1.5 rounded border border-border text-xs text-gray-300 hover:bg-surface-2 hover:text-white transition-colors">Prev</button>
            <span id="page-label" class="text-xs text-dim font-mono">Page 1</span>
            <button id="next-page" class="px-3 py-1.5 rounded border border-border text-xs text-gray-300 hover:bg-surface-2 hover:text-white transition-colors">Next</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
let page = 1;
let perPage = 50;
let total = 0;
let totalPages = 1;
let currentSeverity = '';

function buildYearFilter() {
  const yearSel = document.getElementById('year-filter');
  const now = new Date().getFullYear();
  const years = ['all'];
  for (let y = now; y >= 2015; y--) years.push(String(y));
  yearSel.innerHTML = years.map(y => `<option value="${y}">${y === 'all' ? 'All years' : y}</option>`).join('');
}

function getSeverityColor(sev) {
  if (sev === 'CRITICAL') return 'bg-danger/20 text-danger border-danger/60';
  if (sev === 'HIGH') return 'bg-orange-500/20 text-orange-300 border-orange-500/60';
  if (sev === 'MEDIUM') return 'bg-warning/20 text-yellow-200 border-warning/60';
  if (sev === 'LOW') return 'bg-success/20 text-green-200 border-success/60';
  return 'bg-gray-700/30 text-gray-300 border-gray-600/60';
}

function severityDot(sev) {
  if (sev === 'CRITICAL') return 'background:#f85149';
  if (sev === 'HIGH') return 'background:#f97316';
  if (sev === 'MEDIUM') return 'background:#d29922';
  if (sev === 'LOW') return 'background:#2ea043';
  return 'background:#6b7280';
}

function activityTime(repos) {
  const latest = Math.max(0, ...(repos || []).map(r => r.pushed_at ? new Date(r.pushed_at).getTime() : 0));
  if (!latest) return '—';
  const diff = Math.floor((Date.now() - latest) / 1000);
  if (diff < 3600) return `${Math.max(1, Math.round(diff / 60))}m ago`;
  if (diff < 86400) return `${Math.round(diff / 3600)}h ago`;
  return `${Math.round(diff / 86400)}d ago`;
}

function setLoading() {
  const list = document.getElementById('cve-list');
  list.innerHTML = `
    <div class="p-4 space-y-3">
      <div class="h-14 rounded-lg skeleton"></div>
      <div class="h-14 rounded-lg skeleton"></div>
      <div class="h-14 rounded-lg skeleton"></div>
      <div class="h-14 rounded-lg skeleton"></div>
      <div class="h-14 rounded-lg skeleton"></div>
    </div>`;
}

function setEmpty(message) {
  document.getElementById('cve-list').innerHTML = `
    <div class="flex flex-col items-center justify-center py-14 text-dim text-sm gap-2">
      <span class="material-symbols-outlined text-2xl">search_off</span>
      <p class="text-center max-w-xs">${message}</p>
      <button onclick="clearFilters()"
        class="mt-2 px-3 py-1.5 rounded border border-primary/60 text-primary text-[10px] font-semibold uppercase tracking-wide hover:bg-primary hover:text-white transition-colors">
        Clear Filters
      </button>
    </div>`;
}

function renderRows(rows) {
  const list = document.getElementById('cve-list');
  list.innerHTML = rows.map((item) => {
    const intel = item.intel || {};
    const severity = (intel.v || 'UNSCORED').toUpperCase();
    const cvss = typeof intel.s === 'number' ? intel.s.toFixed(1) : '—';
    const kev = intel.k ? 'Yes' : 'No';
    const epss = typeof intel.e === 'number' ? `${(intel.e * 100).toFixed(2)}%` : '—';
    const repoCount = (item.repositories || []).length;
    const activity = activityTime(item.repositories || []);

    return `
      <div class="grid grid-cols-12 gap-2 px-4 py-3 items-center hover:bg-surface-2/40 transition-colors">
        <div class="col-span-3 font-mono text-xs text-white truncate">${item.cve_id}</div>
        <div class="col-span-2 flex items-center gap-2">
          <span class="sev-dot" style="${severityDot(severity)}"></span>
          <span class="px-1.5 py-0.5 rounded text-[10px] font-semibold border ${getSeverityColor(severity)}">${severity}</span>
        </div>
        <div class="col-span-1 text-xs font-mono text-gray-300">${cvss}</div>
        <div class="col-span-1 text-xs ${kev === 'Yes' ? 'text-danger font-semibold' : 'text-dim'}">${kev}</div>
        <div class="col-span-1 text-xs font-mono text-gray-300">${epss}</div>
        <div class="col-span-2 text-right text-xs font-mono text-gray-300">${repoCount.toLocaleString()}</div>
        <div class="col-span-2 text-right text-xs text-dim">${activity}</div>
      </div>`;
  }).join('');
}

function readFilters() {
  const q = document.getElementById('search-input').value.trim();
  const yearRaw = document.getElementById('year-filter').value;
  const kevOnly = document.getElementById('kev-only').checked;

  const params = new URLSearchParams();
  params.set('page', String(page));
  params.set('per_page', String(perPage));

  if (q) params.set('q', q);
  if (yearRaw !== 'all') params.set('year', yearRaw);
  if (currentSeverity) params.set('severity', currentSeverity);
  if (kevOnly) params.set('kev', 'true');

  return params;
}

async function loadTriage() {
  setLoading();
  const params = readFilters();

  try {
    const res = await fetch(`/api/search?${params.toString()}`);
    if (!res.ok) {
      const text = await res.text();
      throw new Error(text || 'search failed');
    }

    const data = await res.json();
    total = data.total || 0;
    totalPages = Math.max(1, Math.ceil(total / perPage));

    document.getElementById('total-card').textContent = total.toLocaleString();
    document.getElementById('result-meta').textContent = `Showing page ${page} of ${totalPages} · ${total.toLocaleString()} total`;
    document.getElementById('page-label').textContent = `Page ${page} / ${totalPages}`;

    document.getElementById('prev-page').disabled = page <= 1;
    document.getElementById('next-page').disabled = page >= totalPages;

    if (!data.cves || data.cves.length === 0) {
      setEmpty('No CVEs match the active triage filters.');
      return;
    }

    renderRows(data.cves);
  } catch (err) {
    setEmpty('Unable to load triage data right now. Please retry.');
  }
}

function clearFilters() {
  document.getElementById('search-input').value = '';
  document.getElementById('year-filter').value = 'all';
  document.getElementById('kev-only').checked = false;
  currentSeverity = '';
  document.querySelectorAll('.severity-checkbox').forEach((cb) => {
    cb.checked = cb.value === '';
  });
  page = 1;
  loadTriage();
}

function wireSeverityCheckboxes() {
  const boxes = Array.from(document.querySelectorAll('.severity-checkbox'));
  boxes.forEach((box) => {
    box.addEventListener('change', () => {
      boxes.forEach((other) => {
        if (other !== box) other.checked = false;
      });
      if (!box.checked) {
        box.checked = true;
      }
      currentSeverity = box.value || '';
      page = 1;
      loadTriage();
    });
  });
}

function wireControls() {
  document.getElementById('apply-filters').addEventListener('click', () => {
    page = 1;
    loadTriage();
  });

  document.getElementById('clear-filters').addEventListener('click', clearFilters);

  document.getElementById('year-filter').addEventListener('change', () => {
    page = 1;
    loadTriage();
  });

  document.getElementById('kev-only').addEventListener('change', () => {
    page = 1;
    loadTriage();
  });

  document.getElementById('per-page').addEventListener('change', (e) => {
    perPage = parseInt(e.target.value, 10);
    page = 1;
    loadTriage();
  });

  document.getElementById('prev-page').addEventListener('click', () => {
    if (page > 1) {
      page -= 1;
      loadTriage();
    }
  });

  document.getElementById('next-page').addEventListener('click', () => {
    if (page < totalPages) {
      page += 1;
      loadTriage();
    }
  });

  let searchDebounce = null;
  document.getElementById('search-input').addEventListener('input', () => {
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(() => {
      page = 1;
      loadTriage();
    }, 250);
  });
}

document.addEventListener('DOMContentLoaded', async () => {
  buildYearFilter();
  wireSeverityCheckboxes();
  wireControls();
  await loadTriage();
});
</script>
</body>
</html>
