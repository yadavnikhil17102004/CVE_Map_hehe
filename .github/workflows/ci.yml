name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build scrapers
        run: |
          go build cvemapping.go
          go build nvd_scraper.go
          go build news_scraper.go
          go build validate.go

      - name: Validate dataset integrity
        run: go run validate.go

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Playwright
        run: |
          python3 -m pip install --upgrade pip playwright
          python3 -m playwright install --with-deps chromium

      - name: Run browser smoke tests
        continue-on-error: true
        run: |
          mkdir -p artifacts/issue-6
          python3 -m http.server 8000 --bind 127.0.0.1 >artifacts/issue-6/http-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/index.html >/dev/null; then
              break
            fi
            sleep 1
          done
          python3 scripts/ci/issue-6-smoke.py http://127.0.0.1:8000

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-smoke-artifacts
          path: artifacts/issue-6/
          if-no-files-found: ignore
