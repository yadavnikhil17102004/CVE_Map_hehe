name: Continuous Exploit Scraper

on:
  schedule:
    # Runs every 6 hours (offset from top-of-hour news pushes to reduce git contention)
    - cron: "17 */6 * * *"
  # Allows manual triggers from the Actions tab
  workflow_dispatch:

concurrency:
  # Shared with news workflow so only one data-writer runs at a time on main.
  group: data-sync-main
  cancel-in-progress: false

jobs:
  scrape_and_aggregate:
    runs-on: ubuntu-latest

    # We need permission to push the parsed JSON arrays back to the repo
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Execute Scraper Engines
        env:
          GITHUB_TOKEN: ${{ secrets.SYNC_TOKEN }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          go build cvemapping.go
          go build nvd_scraper.go

          YEAR=$(date +%Y)
          LAST_YEAR=$(date -d "last year" +%Y)

          echo "Firing Main Engine..."
          echo "CVE-$YEAR-" | ./cvemapping -github-token "$GITHUB_TOKEN" -export-json -year "$YEAR" -page all
          echo "CVE-$LAST_YEAR-" | ./cvemapping -github-token "$GITHUB_TOKEN" -export-json -year "$LAST_YEAR" -page all

          echo "Firing NVD Intelligence Engine v2.0..."
          ./nvd_scraper

          echo "Running dataset validation checks..."
          go run validate.go

      - name: Commit & Push New Datasets
        run: |
          git config --global user.name "Nikhil Yadav (Bot)"
          git config --global user.email "yadavnikhil17102004@gmail.com"
          git add data/[0-9][0-9][0-9][0-9].json data/nvd_intel_[0-9][0-9][0-9][0-9].json data/news.json 2>/dev/null || true
          # Monolithic nvd_intel.json exceeds GitHub 100MB limit — year files only.
          git rm -f --cached data/nvd_intel.json 2>/dev/null || true

          # Only commit if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): Automated upstream exploit sync [skip ci]"

            max_attempts=5
            success=0
            for attempt in $(seq 1 "$max_attempts"); do
              echo "Push attempt ${attempt}/${max_attempts}"

              # Rebase in case another workflow advanced main while this long job was running.
              if ! git pull --rebase origin main; then
                git rebase --abort || true
                sleep $((attempt * 4))
                continue
              fi

              if git push origin HEAD:main; then
                success=1
                break
              fi

              sleep $((attempt * 4))
            done

            if [ "$success" -ne 1 ]; then
              echo "Failed to push scrape updates after ${max_attempts} attempts."
              exit 1
            fi
          else
            echo "No new CVEs discovered. Skipping push."
          fi
