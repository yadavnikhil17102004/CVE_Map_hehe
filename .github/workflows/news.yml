name: Hourly News Intelligence Scraper

on:
  schedule:
    # Runs at the top of every hour to keep threat intelligence ultra-fresh
    - cron: "0 * * * *"
  # Allows manual triggers from the Actions tab
  workflow_dispatch:

concurrency:
  # Shared with scrape workflow so only one data-writer runs at a time on main.
  group: data-sync-main
  cancel-in-progress: false

jobs:
  scrape_news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Execute News Scraper
        run: |
          go build news_scraper.go
          echo "Firing Live News Scraper..."
          ./news_scraper

      - name: Commit & Push New Data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          # Only commit the news file to prevent race conditions with the CVE scraper
          git add data/news.json
          if ! git diff --cached --quiet; then
            git commit -m "data: hourly live news feed intelligence update"

            max_attempts=5
            success=0
            for attempt in $(seq 1 "$max_attempts"); do
              echo "Push attempt ${attempt}/${max_attempts}"

              # Rebase in case another workflow advanced main while this job was running.
              if ! git pull --rebase origin main; then
                git rebase --abort || true
                sleep $((attempt * 4))
                continue
              fi

              if git push origin HEAD:main; then
                success=1
                break
              fi

              sleep $((attempt * 4))
            done

            if [ "$success" -ne 1 ]; then
              echo "Failed to push news updates after ${max_attempts} attempts."
              exit 1
            fi
          else
            echo "No news deltas. Skipping push."
          fi
